aid: sent

name: Sent

image: https://www.sent.dm/media/images/og-image-4fee8e22.png

description: Sent provides a single API that enables developers to send messages via SMS, WhatsApp, and RCS. The service handles routing, compliance,
  formatting, and delivery, allowing customers in e‑commerce, SaaS, fintech, and healthcare to deliver authentication codes, order notifications,
  cart‑recovery messages, and marketing campaigns. Sent offers SDKs for multiple languages and signed webhooks for delivery tracking.

